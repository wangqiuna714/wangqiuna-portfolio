
name: Daily Embodied Radar Update

on:
  workflow_dispatch:
  schedule:
    - cron: '15 0 * * *'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r embodied-radar/requirements.txt

      - name: Fetch latest news
        run: python embodied-radar/scripts/fetch_news.py

      - name: Save updated news
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add embodied-radar/data/news.json
          git diff --cached --quiet || git commit -m "Update embodied radar news"
          git push
